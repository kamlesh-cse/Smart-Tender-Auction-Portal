# H-1 FIX: Test profile — uses H2 in-memory DB, no real MySQL or SMTP needed
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.flyway.enabled=false
spring.jpa.show-sql=false
spring.jpa.open-in-view=true

# Mock SMTP for tests (Spring Mail needs a host to create JavaMailSender bean)
spring.mail.host=localhost
spring.mail.port=25
spring.mail.username=test@localhost
spring.mail.password=test

# Disable Thymeleaf cache
spring.thymeleaf.cache=false

# Disable scheduler in tests
spring.task.scheduling.pool.size=1

# Admin credentials for tests
app.admin.username=admin
app.admin.password=$2a$10$N9qo8uLOickgx2ZMRZoMye.IjAJAOOJul2dO1DjpXa3RHsB8WTXWG

# Upload dir
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
spring.web.resources.static-locations=classpath:/static/

# Upload dir for tests
app.upload.dir=${java.io.tmpdir}/smartportal-test-uploads/
app.secret=test-secret-value
app.security.login.max-attempts=5
app.security.login.lock-duration=PT15M
