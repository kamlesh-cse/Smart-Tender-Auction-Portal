spring.datasource.url=${DB_URL:jdbc:mariadb://localhost:3306/smart_portal}
spring.datasource.username=${DB_USERNAME:smartportal}
spring.datasource.password=${DB_PASSWORD:SmartPortal@2026}
spring.datasource.driver-class-name=org.mariadb.jdbc.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.flyway.enabled=true
spring.thymeleaf.cache=true
server.servlet.session.cookie.secure=true
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=strict
server.servlet.session.timeout=30m
server.forward-headers-strategy=framework
spring.jpa.open-in-view=false
app.security.trust-forwarded-for=${TRUST_FORWARDED_FOR:true}
logging.level.root=INFO
logging.level.org.springframework.security=WARN
