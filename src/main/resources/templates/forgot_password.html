<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password | Smart Portal</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #4e73df;
            --dark: #1a1c23;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #1a1c23 0%, #2d3561 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .auth-wrapper {
            width: 100%;
            max-width: 440px;
        }

        .brand-header {
            text-align: center;
            margin-bottom: 28px;
        }

        .brand-header .logo {
            font-size: 2.5rem;
        }

        .brand-header h2 {
            color: #fff;
            font-size: 1.4rem;
            font-weight: 700;
            margin: 8px 0 4px;
        }

        .brand-header p {
            color: rgba(255, 255, 255, 0.55);
            font-size: 0.87rem;
        }

        .auth-card {
            background: #fff;
            border-radius: 16px;
            padding: 36px 32px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
        }

        .auth-card h4 {
            font-weight: 700;
            color: var(--dark);
            margin-bottom: 4px;
        }

        .auth-card .sub {
            color: #888;
            font-size: 0.85rem;
            margin-bottom: 24px;
        }

        .form-label {
            font-size: 0.85rem;
            font-weight: 600;
            color: #4e5e7a;
            margin-bottom: 5px;
        }

        .form-control {
            border: 1.5px solid #e0e4ef;
            border-radius: 8px;
            padding: 10px 14px;
            font-size: 0.9rem;
            transition: border-color 0.2s;
        }

        .form-control:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(78, 115, 223, 0.12);
        }

        .btn-submit {
            width: 100%;
            background: linear-gradient(135deg, #f6c23e, #e0a800);
            border: none;
            border-radius: 8px;
            padding: 12px;
            font-weight: 600;
            font-size: 0.95rem;
            color: #1a1c23;
            margin-top: 6px;
            cursor: pointer;
            transition: opacity 0.2s;
        }

        .btn-submit:hover {
            opacity: 0.9;
        }

        .link-row {
            text-align: center;
            font-size: 0.87rem;
            color: #666;
            margin-top: 20px;
        }

        .link-row a {
            color: var(--primary);
            font-weight: 600;
            text-decoration: none;
        }

        .link-row a:hover {
            text-decoration: underline;
        }

        .alert {
            border-radius: 8px;
            font-size: 0.87rem;
            padding: 10px 14px;
        }

        .info-box {
            background: #f0f6ff;
            border: 1px solid #b6d4fe;
            border-radius: 10px;
            padding: 14px 16px;
            margin-bottom: 22px;
            font-size: 0.85rem;
            color: #0d6efd;
        }
    </style>
</head>

<body>
    <div class="auth-wrapper">
        <div class="brand-header">
            <div class="logo">🔐</div>
            <h2>Smart Portal</h2>
            <p>Reset Your Password</p>
        </div>

        <div class="auth-card">
            <h4>Forgot Password?</h4>
            <p class="sub">Enter your registered email to receive an OTP</p>

            <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>
            <div th:if="${success}" class="alert alert-success" th:text="${success}"></div>

            <div class="info-box">
                📧 Enter your registered email address and we'll send a <strong>6-digit OTP</strong> to verify your
                identity. The OTP expires in <strong>10 minutes</strong>.
            </div>

            <form th:action="@{/forgot-password}" method="post"><input type="hidden" name="_csrf" th:value="${_csrf}" />
                <div class="mb-4">
                    <label class="form-label">Registered Email Address</label>
                    <input type="email" name="email" class="form-control" placeholder="Enter your email address"
                        required autofocus>
                </div>
                <button type="submit" class="btn-submit">📨 Send OTP →</button>
            </form>

            <div class="link-row">
                <a th:href="@{/login}">← Back to Login</a>
            </div>
        </div>
    </div>

<link rel="stylesheet" th:href="@{/css/chatbot.css}">
<script th:src="@{/js/chatbot.js}"></script>
</body>

</html>
