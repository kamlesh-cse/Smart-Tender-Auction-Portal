<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Logged Out - SmartPortal</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            background:
                radial-gradient(circle at 18% 20%, rgba(102, 126, 234, 0.28), transparent 34%),
                radial-gradient(circle at 86% 8%, rgba(118, 75, 162, 0.26), transparent 30%),
                linear-gradient(135deg, #f6f8ff 0%, #eef3ff 44%, #f8fbff 100%);
            color: #172033;
            display: grid;
            place-items: center;
            padding: 28px 18px;
        }

        .logout-card {
            width: min(460px, 100%);
            border: 1px solid rgba(255, 255, 255, 0.72);
            border-radius: 28px;
            background: rgba(255, 255, 255, 0.84);
            backdrop-filter: blur(18px);
            box-shadow: 0 28px 70px rgba(31, 44, 92, 0.16);
            padding: 38px;
            text-align: center;
            animation: riseIn 0.55s ease both;
        }

        .brand {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            color: #4757b8;
            font-weight: 800;
            margin-bottom: 26px;
            letter-spacing: 0;
        }

        .brand-mark {
            width: 38px;
            height: 38px;
            border-radius: 14px;
            display: grid;
            place-items: center;
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: #ffffff;
            box-shadow: 0 12px 26px rgba(102, 126, 234, 0.26);
        }

        .success-icon {
            width: 88px;
            height: 88px;
            border-radius: 50%;
            display: grid;
            place-items: center;
            margin: 0 auto 24px;
            color: #ffffff;
            font-size: 42px;
            font-weight: 900;
            background: linear-gradient(135deg, #22c55e, #10b981);
            box-shadow: 0 18px 42px rgba(16, 185, 129, 0.32);
            animation: softPulse 2.8s ease-in-out infinite;
        }

        h1 {
            margin: 0 0 12px;
            font-size: clamp(28px, 6vw, 38px);
            line-height: 1.08;
            color: #15213c;
        }

        p {
            color: #5f6c86;
            line-height: 1.6;
            margin: 0 auto 28px;
            max-width: 340px;
        }

        .actions {
            display: flex;
            gap: 14px;
            justify-content: center;
            flex-wrap: wrap;
        }

        form {
            margin: 0;
        }

        button,
        .home-link {
            min-width: 148px;
            border: 0;
            border-radius: 14px;
            padding: 13px 20px;
            font-weight: 800;
            cursor: pointer;
            text-decoration: none;
            transition: transform 0.2s ease, box-shadow 0.2s ease, background 0.2s ease;
        }

        button {
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: #ffffff;
            box-shadow: 0 16px 32px rgba(102, 126, 234, 0.28);
        }

        .home-link {
            background: rgba(255, 255, 255, 0.74);
            color: #172033;
            border: 1px solid rgba(102, 126, 234, 0.18);
        }

        button:hover,
        .home-link:hover {
            transform: translateY(-2px);
            box-shadow: 0 18px 34px rgba(31, 44, 92, 0.14);
        }

        button:focus-visible,
        .home-link:focus-visible {
            outline: 3px solid rgba(102, 126, 234, 0.34);
            outline-offset: 3px;
        }

        @keyframes riseIn {
            from {
                opacity: 0;
                transform: translateY(18px) scale(0.98);
            }
            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        @keyframes softPulse {
            0%, 100% {
                transform: scale(1);
            }
            50% {
                transform: scale(1.04);
            }
        }

        @media (prefers-color-scheme: dark) {
            body {
                background:
                    radial-gradient(circle at 18% 20%, rgba(102, 126, 234, 0.25), transparent 34%),
                    radial-gradient(circle at 86% 8%, rgba(118, 75, 162, 0.24), transparent 30%),
                    linear-gradient(135deg, #111827 0%, #172033 48%, #0f172a 100%);
                color: #eef2ff;
            }

            .logout-card {
                background: rgba(17, 24, 39, 0.78);
                border-color: rgba(255, 255, 255, 0.12);
                box-shadow: 0 28px 70px rgba(0, 0, 0, 0.3);
            }

            h1 {
                color: #ffffff;
            }

            p {
                color: #cbd5e1;
            }

            .home-link {
                background: rgba(255, 255, 255, 0.08);
                color: #eef2ff;
                border-color: rgba(255, 255, 255, 0.14);
            }
        }

        @media (prefers-reduced-motion: reduce) {
            *,
            *::before,
            *::after {
                animation-duration: 0.01ms !important;
                animation-iteration-count: 1 !important;
                scroll-behavior: auto !important;
                transition-duration: 0.01ms !important;
            }
        }

        @media (max-width: 520px) {
            .logout-card {
                padding: 32px 22px;
                border-radius: 24px;
            }

            .actions,
            .actions form,
            button,
            .home-link {
                width: 100%;
            }
        }
    </style>
</head>
<body>
    <main class="logout-card" aria-labelledby="logout-title">
        <div class="brand" aria-label="Smart Tender and Auction Portal">
            <span class="brand-mark" aria-hidden="true">S</span>
            <span>Smart Tender &amp; Auction</span>
        </div>
        <div class="success-icon" aria-hidden="true">✓</div>
        <h1 id="logout-title">You have been logged out</h1>
        <p>Your secure session is ready to close. Sign in again to continue managing tenders and auctions.</p>
        <div class="actions">
            <form th:action="@{/logout}" method="post">
                <input type="hidden" name="_csrf" th:value="${_csrf}">
                <button type="submit">Login Again</button>
            </form>
            <a class="home-link" th:href="@{/}">Go Home</a>
        </div>
    </main>
</body>
</html>
