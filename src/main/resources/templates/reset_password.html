<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password | Smart Portal</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #4e73df;
            --green: #1cc88a;
            --dark: #1a1c23;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #1a1c23 0%, #2d3561 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .auth-wrapper {
            width: 100%;
            max-width: 440px;
        }

        .brand-header {
            text-align: center;
            margin-bottom: 28px;
        }

        .brand-header .logo {
            font-size: 2.5rem;
        }

        .brand-header h2 {
            color: #fff;
            font-size: 1.4rem;
            font-weight: 700;
            margin: 8px 0 4px;
        }

        .brand-header p {
            color: rgba(255, 255, 255, 0.55);
            font-size: 0.87rem;
        }

        .auth-card {
            background: #fff;
            border-radius: 16px;
            padding: 36px 32px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
        }

        .auth-card h4 {
            font-weight: 700;
            color: var(--dark);
            margin-bottom: 4px;
        }

        .auth-card .sub {
            color: #888;
            font-size: 0.85rem;
            margin-bottom: 24px;
        }

        .form-label {
            font-size: 0.85rem;
            font-weight: 600;
            color: #4e5e7a;
            margin-bottom: 5px;
        }

        .form-control {
            border: 1.5px solid #e0e4ef;
            border-radius: 8px;
            padding: 10px 14px;
            font-size: 0.9rem;
            transition: border-color 0.2s;
        }

        .form-control:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(78, 115, 223, 0.12);
        }

        .btn-reset {
            width: 100%;
            background: linear-gradient(135deg, var(--green), #13a06e);
            border: none;
            border-radius: 8px;
            padding: 12px;
            font-weight: 700;
            font-size: 0.95rem;
            color: #fff;
            margin-top: 6px;
            cursor: pointer;
            transition: opacity 0.2s;
        }

        .btn-reset:hover {
            opacity: 0.9;
        }

        .link-row {
            text-align: center;
            font-size: 0.87rem;
            color: #666;
            margin-top: 20px;
        }

        .link-row a {
            color: var(--primary);
            font-weight: 600;
            text-decoration: none;
        }

        .link-row a:hover {
            text-decoration: underline;
        }

        .alert {
            border-radius: 8px;
            font-size: 0.87rem;
            padding: 10px 14px;
        }

        /* Password toggle */
        .pw-wrapper {
            position: relative;
        }

        .pw-toggle {
            position: absolute;
            right: 12px;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            cursor: pointer;
            font-size: 1.1rem;
            color: #aaa;
            padding: 0;
            line-height: 1;
        }

        .pw-toggle:hover {
            color: var(--primary);
        }

        .pw-wrapper .form-control {
            padding-right: 42px;
        }

        /* Strength bar */
        .strength-bar {
            height: 4px;
            border-radius: 4px;
            margin-top: 6px;
            background: #e0e4ef;
        }

        .strength-bar .fill {
            height: 100%;
            border-radius: 4px;
            transition: width 0.3s, background 0.3s;
            width: 0%;
        }

        .strength-label {
            font-size: 0.75rem;
            margin-top: 3px;
            color: #888;
            min-height: 16px;
        }

        /* Verified badge */
        .verified-badge {
            background: #f0faf7;
            border: 1px solid #b8e0d4;
            border-radius: 10px;
            padding: 12px 16px;
            margin-bottom: 22px;
            font-size: 0.85rem;
            color: #13a06e;
            display: flex;
            align-items: center;
            gap: 8px;
        }
    </style>
</head>

<body>
    <div class="auth-wrapper">
        <div class="brand-header">
            <div class="logo">🔑</div>
            <h2>Smart Portal</h2>
            <p>Create a New Password</p>
        </div>

        <div class="auth-card">
            <h4>Reset Password</h4>
            <p class="sub">Choose a strong new password</p>

            <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>
            <div th:if="${success}" class="alert alert-success" th:text="${success}"></div>

            <!-- Verified identity badge -->
            <div class="verified-badge">
                <span>✅</span>
                <span>Identity verified for <strong th:text="${verifiedEmail}">user@example.com</strong></span>
            </div>

            <form th:action="@{/reset-password}" method="post" id="resetForm"><input type="hidden" name="_csrf" th:value="${_csrf}" />
                <!-- Hidden field carries the verified email -->
                <input type="hidden" name="email" th:value="${verifiedEmail}">

                <div class="mb-3">
                    <label class="form-label">New Password <span style="color:#e74a3b">*</span></label>
                    <div class="pw-wrapper">
                        <input type="password" name="newPassword" id="newPassword" class="form-control"
                            placeholder="Minimum 6 characters" minlength="6" required autofocus>
                        <button type="button" class="pw-toggle" id="pwToggle1"
                            onclick="togglePw('newPassword','pwToggle1')" title="Show/Hide">👁️</button>
                    </div>
                    <!-- Strength bar -->
                    <div class="strength-bar">
                        <div class="fill" id="strengthFill"></div>
                    </div>
                    <div class="strength-label" id="strengthLabel"></div>
                </div>

                <div class="mb-4">
                    <label class="form-label">Confirm New Password <span style="color:#e74a3b">*</span></label>
                    <div class="pw-wrapper">
                        <input type="password" name="confirmPassword" id="confirmPassword" class="form-control"
                            placeholder="Re-enter your new password" minlength="6" required>
                        <button type="button" class="pw-toggle" id="pwToggle2"
                            onclick="togglePw('confirmPassword','pwToggle2')" title="Show/Hide">👁️</button>
                    </div>
                    <div id="matchError" class="text-danger" style="font-size:0.8rem; display:none; margin-top:4px">
                        ❌ Passwords do not match.
                    </div>
                </div>

                <button type="submit" class="btn-reset">🔒 Reset Password</button>
            </form>

            <div class="link-row">
                <a th:href="@{/login}">← Back to Login</a>
            </div>
        </div>
    </div>

    <script>
        // Show / Hide toggle (reusable for both fields)
        function togglePw(inputId, btnId) {
            const input = document.getElementById(inputId);
            const btn = document.getElementById(btnId);
            if (input.type === 'password') {
                input.type = 'text';
                btn.textContent = '🙈';
            } else {
                input.type = 'password';
                btn.textContent = '👁️';
            }
        }

        // Password strength bar
        document.getElementById('newPassword').addEventListener('input', function () {
            const val = this.value;
            const fill = document.getElementById('strengthFill');
            const label = document.getElementById('strengthLabel');

            let score = 0;
            if (val.length >= 6) score++;
            if (val.length >= 10) score++;
            if (/[A-Z]/.test(val)) score++;
            if (/[0-9]/.test(val)) score++;
            if (/[^A-Za-z0-9]/.test(val)) score++;

            const levels = [
                { pct: '0%', color: '#e0e4ef', text: '' },
                { pct: '20%', color: '#e74a3b', text: '🔴 Very Weak' },
                { pct: '40%', color: '#f6c23e', text: '🟡 Weak' },
                { pct: '60%', color: '#f6c23e', text: '🟡 Fair' },
                { pct: '80%', color: '#1cc88a', text: '🟢 Strong' },
                { pct: '100%', color: '#1cc88a', text: '🟢 Very Strong' },
            ];

            const lvl = levels[score] || levels[0];
            fill.style.width = lvl.pct;
            fill.style.background = lvl.color;
            label.textContent = lvl.text;
        });

        // Confirm match check + form validation
        document.getElementById('resetForm').addEventListener('submit', function (e) {
            const pw1 = document.getElementById('newPassword').value;
            const pw2 = document.getElementById('confirmPassword').value;
            if (pw1 !== pw2) {
                e.preventDefault();
                document.getElementById('matchError').style.display = 'block';
            } else {
                document.getElementById('matchError').style.display = 'none';
            }
        });
    </script>

<link rel="stylesheet" th:href="@{/css/chatbot.css}">
<script th:src="@{/js/chatbot.js}"></script>
</body>

</html>
