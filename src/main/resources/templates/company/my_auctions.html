<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Auctions | Company</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --sidebar-w: 240px;
            --primary: #7c3aed;
            --accent: #a78bfa;
            --green: #1cc88a;
            --red: #e74a3b;
            --dark: #1a1c23;
            --light: #f8f9fc;
        }

        * {
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: var(--light);
            margin: 0;
        }

        #sidebar {
            width: var(--sidebar-w);
            height: 100vh;
            position: fixed;
            top: 0;
            left: 0;
            background: var(--dark);
            z-index: 100;
            display: flex;
            flex-direction: column;
            overflow-y: auto;
        }

        .sidebar-brand {
            padding: 22px 20px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.06);
            text-align: center;
        }

        .sidebar-brand .logo {
            font-size: 1.5rem;
        }

        .sidebar-brand h5 {
            color: #fff;
            font-weight: 800;
            margin: 6px 0 2px;
            font-size: 1rem;
        }

        .sidebar-brand small {
            color: rgba(255, 255, 255, 0.4);
            font-size: 0.75rem;
        }

        .nav-section {
            font-size: 0.7rem;
            text-transform: uppercase;
            letter-spacing: 0.1rem;
            color: rgba(255, 255, 255, 0.3);
            padding: 18px 20px 6px;
            font-weight: 600;
        }

        .sidebar-link {
            display: flex;
            align-items: center;
            gap: 10px;
            color: rgba(255, 255, 255, 0.65);
            text-decoration: none;
            padding: 11px 20px;
            font-size: 0.87rem;
            font-weight: 500;
            border-left: 3px solid transparent;
            transition: all .2s;
        }

        .sidebar-link:hover,
        .sidebar-link.active {
            color: #fff;
            background: rgba(255, 255, 255, 0.06);
            border-left-color: var(--accent);
        }

        .sidebar-link .icon {
            font-size: 1rem;
            width: 20px;
            text-align: center;
        }

        .sidebar-footer {
            margin-top: auto;
            padding: 16px;
            border-top: 1px solid rgba(255, 255, 255, 0.06);
        }

        .logout-btn {
            display: block;
            text-align: center;
            background: rgba(231, 74, 59, .15);
            color: #e74a3b;
            border: 1px solid rgba(231, 74, 59, .3);
            padding: 9px;
            border-radius: 8px;
            text-decoration: none;
            font-size: .85rem;
            font-weight: 600;
        }

        .logout-btn:hover {
            background: rgba(231, 74, 59, .25);
            color: #e74a3b;
        }

        #main {
            margin-left: var(--sidebar-w);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .topbar {
            background: #fff;
            padding: 0 30px;
            height: 65px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            box-shadow: 0 1px 0 #eee;
            position: sticky;
            top: 0;
            z-index: 50;
        }

        .topbar h5 {
            font-weight: 700;
            color: var(--dark);
            margin: 0;
        }

        .clock-badge {
            background: var(--light);
            border: 1px solid #e8e8e8;
            border-radius: 8px;
            padding: 6px 12px;
            font-size: .8rem;
            color: #555;
            font-weight: 600;
        }

        .user-badge {
            background: linear-gradient(135deg, var(--primary), #5b21b6);
            color: #fff;
            padding: 6px 14px;
            border-radius: 20px;
            font-size: .8rem;
            font-weight: 700;
        }

        .page-body {
            padding: 28px 30px;
            flex: 1;
        }

        .alert {
            border-radius: 10px;
            font-size: .87rem;
            border: none;
        }

        .alert-success {
            background: #d1f0e3;
            color: #0a5c38;
        }

        .alert-danger {
            background: #fde8e8;
            color: #7b1a1a;
        }

        .data-card {
            background: #fff;
            border-radius: 12px;
            box-shadow: 0 2px 12px rgba(0, 0, 0, .06);
            overflow: hidden;
        }

        .data-card .table {
            margin: 0;
            font-size: .85rem;
        }

        .data-card thead th {
            background: var(--light);
            color: #888;
            font-size: .75rem;
            text-transform: uppercase;
            font-weight: 700;
            border: none;
            padding: 12px 16px;
        }

        .data-card tbody td {
            padding: 12px 16px;
            vertical-align: middle;
            border-top: 1px solid #f5f5f5;
            color: #444;
        }

        .data-card tbody tr:hover {
            background: #faf7ff;
        }

        .badge-open {
            background: #d1f0e3;
            color: #0a5c38;
            padding: 3px 10px;
            border-radius: 20px;
            font-size: .75rem;
            font-weight: 700;
        }

        .badge-closed {
            background: #fde8e8;
            color: #7b1a1a;
            padding: 3px 10px;
            border-radius: 20px;
            font-size: .75rem;
            font-weight: 700;
        }

        .btn-tbl-view {
            background: #ede9fe;
            color: #5b21b6;
            border: none;
            padding: 5px 11px;
            border-radius: 6px;
            font-size: .78rem;
            font-weight: 600;
            text-decoration: none;
        }

        .btn-tbl-edit {
            background: #fff3d4;
            color: #7d6608;
            border: none;
            padding: 5px 11px;
            border-radius: 6px;
            font-size: .78rem;
            font-weight: 600;
            text-decoration: none;
        }

        .btn-tbl-del {
            background: #fde8e8;
            color: #7b1a1a;
            border: none;
            padding: 5px 11px;
            border-radius: 6px;
            font-size: .78rem;
            font-weight: 600;
            cursor: pointer;
        }

        .btn-new {
            background: linear-gradient(135deg, var(--primary), #5b21b6);
            color: #fff;
            border: none;
            padding: 9px 20px;
            border-radius: 8px;
            font-weight: 700;
            font-size: .85rem;
            text-decoration: none;
        }

        .btn-new:hover {
            opacity: .88;
            color: #fff;
        }

        .search-bar {
            background: #fff;
            border: 1.5px solid #e8e8e8;
            border-radius: 8px;
            padding: 8px 14px;
            font-size: .88rem;
            width: 220px;
        }

        .search-bar:focus {
            outline: none;
            border-color: var(--primary);
        }

        .auction-thumb {
            width: 42px;
            height: 42px;
            object-fit: cover;
            border-radius: 8px;
            border: 1px solid #eee;
        }

        .thumb-placeholder {
            width: 42px;
            height: 42px;
            background: #f0f0f0;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.2rem;
        }

        .countdown {
            font-size: .75rem;
            color: var(--primary);
            font-weight: 600;
        }

        .countdown.urgent {
            color: var(--red);
        }
    </style>
</head>

<body>
    <th:block th:replace="~{fragments/sidebar :: sidebarStyles}"></th:block>
    <th:block th:replace="~{fragments/sidebar :: sidebar('COMPANY','my-auctions')}"></th:block>
    <div id="main">
        <div class="topbar">
            <h5>📁 My Auctions</h5>
            <div style="display:flex;align-items:center;gap:14px">
                <div class="clock-badge">🕐 <span id="clock"></span></div>
                <div class="user-badge">🏢 <span th:text="${companyName}">Company</span></div>
            </div>
        </div>
        <div class="page-body">
            <div th:if="${success}" class="alert alert-success mb-3" th:text="${success}"></div>
            <div th:if="${error}" class="alert alert-danger  mb-3" th:text="${error}"></div>

            <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:20px">
                <div>
                    <h6 style="font-weight:800;color:var(--dark);margin:0">My Published Auctions</h6>
                    <small class="text-muted" th:text="${#lists.size(auctions)}+' auctions'"></small>
                </div>
                <div style="display:flex;gap:10px;align-items:center">
                    <input type="text" id="searchInput" class="search-bar" placeholder="🔍 Search..."
                        onkeyup="filterTable()">
                    <a th:href="@{/company/auction/create}" class="btn-new">+ New Auction</a>
                </div>
            </div>

            <div class="data-card">
                <table class="table" id="auctionTable">
                    <thead>
                        <tr>
                            <th>#</th>
                            <th>Photo</th>
                            <th>Title</th>
                            <th>Starting Price</th>
                            <th>Highest Bid</th>
                            <th>Deadline</th>
                            <th>Status</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="a, i : ${auctions}">
                            <td class="text-muted" th:text="${i.index+1}">1</td>
                            <td>
                                <img th:if="${a.photo != null and !#strings.isEmpty(a.photo)}"
                                    th:src="@{'/uploads/'+${a.photo}}" class="auction-thumb">
                                <div th:unless="${a.photo != null and !#strings.isEmpty(a.photo)}"
                                    class="thumb-placeholder">🔨</div>
                            </td>
                            <td style="font-weight:600" th:text="${a.title}">Title</td>
                            <td
                                th:text="${a.startingPrice != null ? '₹'+#numbers.formatDecimal(a.startingPrice, 1, 'COMMA', 0, 'POINT') : '—'}">
                                —</td>
                            <td style="font-weight:700;color:var(--green)"
                                th:text="${a.currentHighestBid > 0 ? '₹'+#numbers.formatDecimal(a.currentHighestBid, 1, 'COMMA', 0, 'POINT') : 'No bids'}">
                                —</td>
                            <td>
                                <div style="font-size:.82rem" th:text="${a.deadline}">—</div>
                                <div class="countdown" th:if="${a.lifecycleStatus == 'LIVE'}" th:attr="data-deadline=${a.deadline}"
                                    th:id="'cd-'+${a.id}">...</div>
                            </td>
                            <td>
                                <span th:if="${a.lifecycleStatus == 'LIVE'}" class="badge-open">LIVE</span>
                                <span th:unless="${a.lifecycleStatus == 'LIVE'}" th:style="${a.lifecycleStatus == 'UPCOMING' ? 'background:#fff3d4;color:#7d6608;padding:3px 10px;border-radius:20px;font-size:.75rem;font-weight:700' : 'background:#e5e7eb;color:#4b5563;padding:3px 10px;border-radius:20px;font-size:.75rem;font-weight:700'}" th:text="${a.lifecycleStatus}">CLOSED</span>
                            </td>
                            <td>
                                <a th:href="@{'/company/auction/view/'+${a.id}}" class="btn-tbl-view me-1">View</a>
                                <!-- Show Edit/Delete only if NOT started -->
                                <th:block th:if="${!a.editLocked}">
                                    <a th:href="@{'/company/auction/edit/'+${a.id}}" class="btn-tbl-edit me-1">Edit</a>
                                    <button class="btn-tbl-del" th:data-id="${a.id}" th:data-title="${a.title}"
                                        onclick="confirmDelete(this.dataset.title, this.dataset.id)">Del</button>
                                </th:block>
                                <th:block th:if="${a.editLocked}">
                                    <span style="background:#fff3d4;color:#7d6608;padding:3px 10px;border-radius:20px;font-size:.72rem;font-weight:700" title="Auction has started — cannot edit or delete">🔒 Started</span>
                                </th:block>
                            </td>
                        </tr>
                        <tr th:if="${#lists.isEmpty(auctions)}">
                            <td colspan="8" class="text-center text-muted py-4">
                                No auctions yet. <a th:href="@{/company/auction/create}"
                                    style="color:var(--primary);font-weight:600">Create one →</a>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- Delete Confirm Modal -->
    <div class="modal fade" id="deleteModal" tabindex="-1">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content" style="border-radius:14px;border:none">
                <div class="modal-body text-center p-4">
                    <div style="font-size:2.5rem;margin-bottom:12px">🗑️</div>
                    <h5 style="font-weight:800">Delete Auction?</h5>
                    <p style="color:#888;font-size:.9rem">Are you sure you want to delete <strong
                            id="itemName"></strong>? This cannot be undone.</p>
                    <div style="display:flex;gap:10px;justify-content:center;margin-top:20px">
                        <button class="btn btn-light px-4" data-bs-dismiss="modal">Cancel</button>
                        <button class="btn btn-danger px-4" onclick="executeDelete()">Yes, Delete</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Hidden POST form for delete -->
    <form id="deleteForm" method="post" style="display:none"><input type="hidden" name="_csrf" th:value="${_csrf}" />
        <input type="hidden" name="_method" value="post">
    </form>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        function updateClock() { document.getElementById('clock').textContent = new Date().toLocaleString('en-IN', { day: '2-digit', month: 'short', year: 'numeric', hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: true }); }
        updateClock(); setInterval(updateClock, 1000);
        function filterTable() { const q = document.getElementById('searchInput').value.toLowerCase(); document.querySelectorAll('#auctionTable tbody tr').forEach(r => { r.style.display = r.textContent.toLowerCase().includes(q) ? '' : 'none'; }); }
        const deleteModal = new bootstrap.Modal(document.getElementById('deleteModal'));
        let deleteUrl = '';
        function confirmDelete(name, id) { document.getElementById('itemName').textContent = name; deleteUrl = '/company/auction/delete/' + id; deleteModal.show(); }
        function executeDelete() { const f = document.getElementById('deleteForm'); f.action = deleteUrl; f.submit(); }
        function updateCountdowns() { document.querySelectorAll('.countdown[data-deadline]').forEach(el => { const diff = new Date(el.dataset.deadline) - new Date(); if (diff <= 0) { el.textContent = 'Expired'; el.classList.add('urgent'); return; } const h = Math.floor(diff / 3600000), m = Math.floor((diff % 3600000) / 60000), s = Math.floor((diff % 60000) / 1000); el.textContent = '⏱ ' + h + 'h ' + m + 'm ' + s + 's left'; if (h < 1) el.classList.add('urgent'); }); }
        updateCountdowns(); setInterval(updateCountdowns, 1000);
    </script>

<link rel="stylesheet" th:href="@{/css/chatbot.css}">
<script th:src="@{/js/chatbot.js}"></script>
</body>

</html>
