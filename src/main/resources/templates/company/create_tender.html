<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Tender | Company</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root { --sidebar-w:260px; --primary:#7c3aed; --dark:#1a1c23; --light:#f8f9fc; }
        * { box-sizing:border-box; }
        body { font-family:'Inter',sans-serif; background:var(--light); margin:0; }
        #main { margin-left:var(--sidebar-w); min-height:100vh; }
        .topbar { background:#fff; padding:0 30px; height:65px; display:flex; align-items:center; justify-content:space-between; box-shadow:0 1px 0 #eee; }
        .topbar h5 { font-weight:800; margin:0; color:var(--dark); }
        .company-badge { background:linear-gradient(135deg,var(--primary),#5b21b6); color:#fff; padding:6px 14px; border-radius:20px; font-size:.8rem; font-weight:700; }
        .page-body { padding:28px 30px; }
        .form-card { max-width:780px; margin:0 auto; background:#fff; border-radius:12px; box-shadow:0 2px 12px rgba(0,0,0,.06); overflow:hidden; }
        .form-card-header { background:linear-gradient(135deg,var(--primary),#5b21b6); color:#fff; padding:22px 28px; }
        .form-card-header h5 { margin:0; font-weight:800; }
        .form-card-body { padding:28px; }
        .form-label { font-size:.85rem; font-weight:700; color:#4e5e7a; }
        .form-control, .form-select { border:1.5px solid #e0e4ef; border-radius:8px; padding:10px 14px; font-size:.9rem; }
        .rule-box { background:#f5f3ff; border:1px solid #ddd6fe; color:#5b21b6; border-radius:8px; padding:12px 14px; font-size:.84rem; margin-bottom:18px; font-weight:600; }
        .btn-submit { background:var(--primary); color:#fff; border:none; border-radius:8px; padding:11px 24px; font-weight:800; }
        .btn-cancel { background:#fff; border:1.5px solid #e0e4ef; border-radius:8px; padding:11px 20px; color:#555; text-decoration:none; font-weight:700; }
    </style>
</head>
<body>
<th:block th:replace="~{fragments/sidebar :: sidebarStyles}"></th:block>
<th:block th:replace="~{fragments/sidebar :: sidebar('COMPANY','tender-create')}"></th:block>

<div id="main">
    <div class="topbar">
        <h5>Create Tender</h5>
        <div class="company-badge" th:text="${companyName}">Company</div>
    </div>

    <div class="page-body">
        <div th:if="${error}" class="alert alert-danger mb-4" th:text="${error}"></div>
        <div class="form-card">
            <div class="form-card-header">
                <h5>New Tender Details</h5>
            </div>
            <div class="form-card-body">
                <div class="rule-box">Tender duration must be at least 3 days.</div>
                <form th:action="@{/company/tender/create}" th:object="${tender}" method="post">
                    <input type="hidden" name="_csrf" th:value="${_csrf}">
                    <input type="hidden" th:field="*{id}">
                    <div class="row g-3">
                        <div class="col-md-8">
                            <label class="form-label">Tender Title *</label>
                            <input type="text" th:field="*{title}" class="form-control" required>
                        </div>
                        <div class="col-md-4">
                            <label class="form-label">Category *</label>
                            <select th:field="*{category}" class="form-select" required>
                                <option value="">Select</option>
                                <option value="Infrastructure">Infrastructure</option>
                                <option value="Technology">Technology</option>
                                <option value="Supply Chain">Supply Chain</option>
                            </select>
                        </div>
                        <div class="col-12">
                            <label class="form-label">Description</label>
                            <textarea th:field="*{description}" class="form-control" rows="4"></textarea>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">Estimated Budget (Rs)</label>
                            <input type="number" th:field="*{estimatedBudget}" class="form-control" min="1" step="0.01">
                        </div>
                        <div class="col-md-6"></div>
                        <div class="col-md-6">
                            <label class="form-label">Start Date *</label>
                            <input type="date" th:field="*{startDate}" class="form-control" id="startDate" required>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">End Date *</label>
                            <input type="date" th:field="*{endDate}" class="form-control" required>
                        </div>
                    </div>
                    <div class="d-flex justify-content-end gap-3 mt-4">
                        <a th:href="@{/company/my-tenders}" class="btn-cancel">Cancel</a>
                        <button type="submit" class="btn-submit">Publish Tender</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
<script>
    document.getElementById("startDate").min = new Date().toISOString().split("T")[0];
</script>
</body>
</html>
