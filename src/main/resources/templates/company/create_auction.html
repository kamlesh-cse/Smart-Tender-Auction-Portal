<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Auction | Company</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root{--sidebar-w:240px;--primary:#7c3aed;--accent:#a78bfa;--dark:#1a1c23;--light:#f8f9fc;}
        *{box-sizing:border-box;}
        body{font-family:'Inter',sans-serif;background:var(--light);margin:0;}
        #sidebar{width:var(--sidebar-w);height:100vh;position:fixed;top:0;left:0;background:var(--dark);z-index:100;display:flex;flex-direction:column;overflow-y:auto;}
        .sidebar-brand{padding:22px 20px;border-bottom:1px solid rgba(255,255,255,0.06);text-align:center;}
        .sidebar-brand .logo{font-size:1.5rem;}
        .sidebar-brand h5{color:#fff;font-weight:800;margin:6px 0 2px;font-size:1rem;}
        .sidebar-brand small{color:rgba(255,255,255,0.4);font-size:0.75rem;}
        .nav-section{font-size:0.7rem;text-transform:uppercase;letter-spacing:0.1rem;color:rgba(255,255,255,0.3);padding:18px 20px 6px;font-weight:600;}
        .sidebar-link{display:flex;align-items:center;gap:10px;color:rgba(255,255,255,0.65);text-decoration:none;padding:11px 20px;font-size:0.87rem;font-weight:500;border-left:3px solid transparent;transition:all .2s;}
        .sidebar-link:hover,.sidebar-link.active{color:#fff;background:rgba(255,255,255,0.06);border-left-color:var(--accent);}
        .sidebar-link .icon{font-size:1rem;width:20px;text-align:center;}
        .sidebar-footer{margin-top:auto;padding:16px;border-top:1px solid rgba(255,255,255,0.06);}
        .logout-btn{display:block;text-align:center;background:rgba(231,74,59,.15);color:#e74a3b;border:1px solid rgba(231,74,59,.3);padding:9px;border-radius:8px;text-decoration:none;font-size:.85rem;font-weight:600;}
        .logout-btn:hover{background:rgba(231,74,59,.25);color:#e74a3b;}
        #main{margin-left:var(--sidebar-w);min-height:100vh;display:flex;flex-direction:column;}
        .topbar{background:#fff;padding:0 30px;height:65px;display:flex;align-items:center;justify-content:space-between;box-shadow:0 1px 0 #eee;position:sticky;top:0;z-index:50;}
        .topbar h5{font-weight:700;color:var(--dark);margin:0;}
        .clock-badge{background:var(--light);border:1px solid #e8e8e8;border-radius:8px;padding:6px 12px;font-size:.8rem;color:#555;font-weight:600;}
        .user-badge{background:linear-gradient(135deg,var(--primary),#5b21b6);color:#fff;padding:6px 14px;border-radius:20px;font-size:.8rem;font-weight:700;}
        .page-body{padding:28px 30px;flex:1;}
        .alert{border-radius:10px;font-size:.87rem;border:none;}
        .alert-success{background:#d1f0e3;color:#0a5c38;}
        .alert-danger{background:#fde8e8;color:#7b1a1a;}
        .form-card{background:#fff;border-radius:14px;box-shadow:0 2px 16px rgba(0,0,0,.07);padding:32px;}
        .section-divider{font-size:.78rem;font-weight:800;color:var(--primary);text-transform:uppercase;letter-spacing:.08rem;padding-bottom:10px;border-bottom:2px solid #ede9fe;margin:28px 0 20px;}
        .form-label{font-size:.83rem;font-weight:700;color:#555;display:block;margin-bottom:6px;}
        .form-control,.form-select{border:1.5px solid #e0e4ef;border-radius:8px;padding:10px 14px;font-size:.9rem;width:100%;transition:border-color .2s;}
        .form-control:focus,.form-select:focus{outline:none;border-color:var(--primary);box-shadow:0 0 0 3px rgba(124,58,237,.12);}
        .form-text{font-size:.77rem;color:#aaa;margin-top:4px;}
        .btn-submit{background:linear-gradient(135deg,var(--primary),#5b21b6);border:none;border-radius:10px;padding:13px 32px;font-weight:800;color:#fff;font-size:.95rem;cursor:pointer;transition:opacity .2s, transform .2s;min-height:44px;display:inline-flex;align-items:center;justify-content:center;}
        .btn-submit:hover{opacity:.88;transform:translateY(-1px);}
        .btn-cancel{background:#fff;border:1.5px solid #dc3545;border-radius:10px;padding:12px 28px;min-height:44px;font-weight:700;color:#dc3545;font-size:.9rem;text-decoration:none;display:inline-flex;align-items:center;justify-content:center;transition:background .2s,color .2s,transform .2s;} .btn-cancel:hover{background:#dc3545;color:#fff;transform:translateY(-1px);} @media(max-width:576px){.form-actions{flex-direction:column}.form-actions .btn-cancel,.form-actions .btn-submit{width:100%;}}
        .info-box{background:#ede9fe;border-radius:10px;padding:14px 18px;font-size:.83rem;color:#5b21b6;font-weight:600;margin-bottom:24px;border-left:4px solid var(--primary);}
        .img-preview{width:100%;max-height:200px;object-fit:cover;border-radius:10px;margin-top:10px;display:none;}
    </style>
</head>
<body>
    <th:block th:replace="~{fragments/sidebar :: sidebarStyles}"></th:block>
    <th:block th:replace="~{fragments/sidebar :: sidebar('COMPANY','auction-create')}"></th:block>
<div id="main">
    <div class="topbar">
        <h5>➕ Create Auction</h5>
        <div style="display:flex;align-items:center;gap:14px">
            <div class="clock-badge">🕐 <span id="clock"></span></div>
            <div class="user-badge">🏢 <span th:text="${companyName}">Company</span></div>
        </div>
    </div>
    <div class="page-body">
        <div th:if="${error}" class="alert alert-danger mb-3" th:text="${error}"></div>

        <div class="info-box">
            ℹ️ Auction duration must be <strong>at least 30 minutes</strong>. The deadline is automatically calculated from date + time + duration.
        </div>

        <div class="form-card">
            <form th:action="@{/company/auction/save}" method="post" enctype="multipart/form-data"><input type="hidden" name="_csrf" th:value="${_csrf}" />

                <div class="section-divider">📋 Auction Details</div>
                <div class="mb-3">
                    <label class="form-label">Auction Title *</label>
                    <input type="text" name="title" class="form-control" placeholder="e.g. Office Furniture Lot — 50 Items" required>
                </div>
                <div class="mb-3">
                    <label class="form-label">Description</label>
                    <textarea name="description" class="form-control" rows="4" placeholder="Describe the items being auctioned, condition, quantity, etc."></textarea>
                </div>
                <div class="mb-3">
                    <label class="form-label">Auction Photo</label>
                    <input type="file" name="imageFile" class="form-control" accept="image/*" onchange="previewImg(this)">
                    <img id="imgPreview" class="img-preview">
                    <div class="form-text">Supported: JPG, PNG, WEBP — max 10MB</div>
                </div>

                <div class="section-divider">💰 Pricing</div>
                <div class="mb-3">
                    <label class="form-label">Starting Price (₹) *</label>
                    <input type="number" name="startingPrice" class="form-control" min="1" step="0.01" placeholder="Minimum bid to start" required>
                </div>

                <div class="section-divider">📅 Schedule</div>
                <div class="row g-3 mb-3">
                    <div class="col-sm-6">
                        <label class="form-label">Auction Date *</label>
                        <input type="date" name="auctionDate" class="form-control" required>
                    </div>
                    <div class="col-sm-6">
                        <label class="form-label">Start Time *</label>
                        <input type="time" name="auctionTime" class="form-control" required>
                    </div>
                </div>
                <div class="mb-4">
                    <label class="form-label">Duration (minutes) * — minimum 30</label>
                    <input type="number" name="durationMinutes" class="form-control" min="30" step="1" placeholder="e.g. 60 for 1 hour, 1440 for 24 hours" required>
                    <div class="form-text">Deadline = Date + Time + Duration</div>
                </div>

                <div class="form-actions" style="display:flex;gap:12px;justify-content:flex-end">
                    <a th:href="@{/company/my-auctions}" class="btn-cancel">Cancel</a>
                    <button type="submit" class="btn-submit">🚀 Publish Auction</button>
                </div>
            </form>
        </div>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>
    function updateClock(){document.getElementById('clock').textContent=new Date().toLocaleString('en-IN',{day:'2-digit',month:'short',year:'numeric',hour:'2-digit',minute:'2-digit',second:'2-digit',hour12:true});}
    updateClock();setInterval(updateClock,1000);
    function previewImg(input){if(input.files&&input.files[0]){const reader=new FileReader();reader.onload=e=>{const img=document.getElementById('imgPreview');img.src=e.target.result;img.style.display='block';};reader.readAsDataURL(input.files[0]);}}
</script>

<link rel="stylesheet" th:href="@{/css/chatbot.css}">
<script th:src="@{/js/chatbot.js}"></script>
</body>
</html>
