<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manage Users | Admin</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        /* Same base styles — copy sidebar/topbar/table CSS from dashboard.html */
        :root {
            --sidebar-w: 260px;
            --primary: #4e73df;
            --green: #1cc88a;
            --yellow: #f6c23e;
            --red: #e74a3b;
            --dark: #1a1c23;
            --light: #f8f9fc;
        }

        * {
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: var(--light);
            margin: 0;
        }

        #sidebar {
            width: var(--sidebar-w);
            height: 100vh;
            position: fixed;
            top: 0;
            left: 0;
            background: var(--dark);
            z-index: 100;
            display: flex;
            flex-direction: column;
            overflow-y: auto;
        }

        .sidebar-brand {
            padding: 22px 20px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.06);
            text-align: center;
        }

        .sidebar-brand .logo {
            font-size: 1.5rem;
        }

        .sidebar-brand h5 {
            color: #fff;
            font-weight: 800;
            margin: 6px 0 2px;
            font-size: 1rem;
        }

        .sidebar-brand small {
            color: rgba(255, 255, 255, 0.4);
            font-size: 0.75rem;
        }

        .nav-section {
            font-size: 0.7rem;
            text-transform: uppercase;
            letter-spacing: 0.1rem;
            color: rgba(255, 255, 255, 0.3);
            padding: 18px 20px 6px;
            font-weight: 600;
        }

        .sidebar-link {
            display: flex;
            align-items: center;
            gap: 10px;
            color: rgba(255, 255, 255, 0.65);
            text-decoration: none;
            padding: 11px 20px;
            font-size: 0.87rem;
            font-weight: 500;
            border-left: 3px solid transparent;
            transition: all 0.2s;
        }

        .sidebar-link:hover,
        .sidebar-link.active {
            color: #fff;
            background: rgba(255, 255, 255, 0.06);
            border-left-color: var(--primary);
        }

        .sidebar-link .icon {
            font-size: 1rem;
            width: 20px;
            text-align: center;
        }

        .sidebar-footer {
            margin-top: auto;
            padding: 16px;
            border-top: 1px solid rgba(255, 255, 255, 0.06);
        }

        .logout-btn {
            display: block;
            text-align: center;
            background: rgba(231, 74, 59, 0.15);
            color: #e74a3b;
            border: 1px solid rgba(231, 74, 59, 0.3);
            padding: 9px;
            border-radius: 8px;
            text-decoration: none;
            font-size: 0.85rem;
            font-weight: 600;
        }

        .logout-btn:hover {
            background: rgba(231, 74, 59, 0.25);
            color: #e74a3b;
        }

        #main {
            margin-left: var(--sidebar-w);
            min-height: 100vh;
        }

        .topbar {
            background: #fff;
            padding: 0 30px;
            height: 65px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            box-shadow: 0 1px 0 #eee;
            position: sticky;
            top: 0;
            z-index: 50;
        }

        .topbar h5 {
            font-weight: 700;
            color: var(--dark);
            margin: 0;
        }

        .clock-badge {
            background: var(--light);
            border: 1px solid #e8e8e8;
            border-radius: 8px;
            padding: 6px 12px;
            font-size: 0.8rem;
            color: #555;
            font-weight: 600;
        }

        .admin-badge {
            background: linear-gradient(135deg, var(--primary), #224abe);
            color: #fff;
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: 700;
        }

        .page-body {
            padding: 28px 30px;
        }

        .alert {
            border-radius: 10px;
            font-size: 0.87rem;
            border: none;
        }

        .alert-success {
            background: #d1f0e3;
            color: #0a5c38;
        }

        .alert-danger {
            background: #fde8e8;
            color: #7b1a1a;
        }

        .data-card {
            background: #fff;
            border-radius: 12px;
            box-shadow: 0 2px 12px rgba(0, 0, 0, 0.06);
            overflow: hidden;
        }

        .data-card .table {
            margin: 0;
            font-size: 0.85rem;
        }

        .data-card thead th {
            background: var(--light);
            color: #888;
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 0.05rem;
            font-weight: 700;
            border: none;
            padding: 12px 16px;
        }

        .data-card tbody td {
            padding: 12px 16px;
            vertical-align: middle;
            border-top: 1px solid #f5f5f5;
            color: #444;
        }

        .data-card tbody tr:hover {
            background: #fafbff;
        }

        .badge-open {
            background: #d1f0e3;
            color: #0a5c38;
            padding: 3px 10px;
            border-radius: 20px;
            font-size: 0.75rem;
            font-weight: 700;
        }

        .badge-closed {
            background: #fde8e8;
            color: #7b1a1a;
            padding: 3px 10px;
            border-radius: 20px;
            font-size: 0.75rem;
            font-weight: 700;
        }

        .badge-role {
            padding: 3px 10px;
            border-radius: 20px;
            font-size: 0.75rem;
            font-weight: 700;
        }

        .role-admin {
            background: #f0e8ff;
            color: #6c3483;
        }

        .role-govt {
            background: #e8edff;
            color: #1a5276;
        }

        .role-company {
            background: #d1f0e3;
            color: #0a5c38;
        }

        .role-user {
            background: #fff3d4;
            color: #7d6608;
        }

        .btn-tbl-edit {
            background: #fff3d4;
            color: #7d6608;
            border: none;
            padding: 4px 10px;
            border-radius: 6px;
            font-size: 0.78rem;
            font-weight: 600;
            text-decoration: none;
        }

        .btn-tbl-del {
            background: #fde8e8;
            color: #7b1a1a;
            border: none;
            padding: 4px 10px;
            border-radius: 6px;
            font-size: 0.78rem;
            font-weight: 600;
            text-decoration: none;
        }

        .search-bar {
            background: #fff;
            border: 1.5px solid #e8e8e8;
            border-radius: 8px;
            padding: 8px 14px;
            font-size: 0.88rem;
            width: 260px;
        }

        .search-bar:focus {
            outline: none;
            border-color: var(--primary);
        }
    </style>
</head>

<body>
    <th:block th:replace="~{fragments/sidebar :: sidebarStyles}"></th:block>
    <th:block th:replace="~{fragments/sidebar :: sidebar('ADMIN','users')}"></th:block>

    <div id="main">
        <div class="topbar">
            <h5>👥 User Management</h5>
            <div style="display:flex;align-items:center;gap:14px">
                <div class="clock-badge">🕐 <span id="clock"></span></div>
                <div class="admin-badge">👑 <span th:text="${adminName}">Admin</span></div>
            </div>
        </div>

        <div class="page-body">
            <div th:if="${success}" class="alert alert-success mb-3" th:text="${success}"></div>
            <div th:if="${error}" class="alert alert-danger  mb-3" th:text="${error}"></div>

            <!-- Header -->
            <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:20px">
                <div>
                    <h6 style="font-weight:800;color:var(--dark);margin:0">All Registered Users</h6>
                    <small class="text-muted" th:text="${#lists.size(users)} + ' total users'">0 users</small>
                </div>
                <input type="text" id="searchInput" class="search-bar" placeholder="🔍 Search by name or email..."
                    onkeyup="filterTable()">
            </div>

            <div class="data-card">
                <table class="table" id="userTable">
                    <thead>
                        <tr>
                            <th>#</th>
                            <th>Name</th>
                            <th>Email</th>
                            <th>Mobile</th>
                            <th>Role</th>
                            <th>Organisation</th>
                            <th>Joined</th>
                            <th>Status</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="u, i : ${users}">
                            <td class="text-muted" th:text="${i.index + 1}">1</td>
                            <td style="font-weight:600" th:text="${u.name}">Name</td>
                            <td th:text="${u.email}">Email</td>
                            <td th:text="${u.mobile}">Mobile</td>
                            <td>
                                <span th:if="${u.role == 'GOVERNMENT'}" class="badge-role role-govt">🏛 GOVT</span>
                                <span th:if="${u.role == 'COMPANY'}" class="badge-role role-company">🏢 COMPANY</span>
                                <span th:if="${u.role == 'USER'}" class="badge-role role-user">👤 USER</span>
                                <span th:if="${u.role == 'ADMIN'}" class="badge-role role-admin">👑 ADMIN</span>
                            </td>
                            <td th:text="${u.organisation != null ? u.organisation : '—'}">—</td>
                            <td style="font-size:0.78rem;color:#aaa"
                                th:text="${u.createdAt != null ? #temporals.format(u.createdAt,'dd MMM yyyy') : '—'}">—
                            </td>
                            <td>
                                <span th:if="${u.active}" class="badge-open">✅ Active</span>
                                <span th:unless="${u.active}" class="badge-closed">🚫 Blocked</span>
                            </td>
                            <td>
                                <!-- Block / Unblock — must be POST, not GET link -->
                                <form th:action="@{'/admin/user/toggle/' + ${u.id}}" method="post"
                                    style="display:inline;"><input type="hidden" name="_csrf" th:value="${_csrf}" />
                                    <button type="submit" th:text="${u.active ? 'Block' : 'Unblock'}"
                                        th:class="${u.active ? 'btn-tbl-del' : 'btn-tbl-edit'}"
                                        th:title="${u.active ? 'Block this user' : 'Unblock this user'}"
                                        onclick="return confirm(this.getAttribute('data-msg'))"
                                        th:attr="data-msg=${u.active ? 'Block this user?' : 'Unblock this user?'}">Toggle</button>
                                </form>
                            </td>
                        </tr>
                        <tr th:if="${#lists.isEmpty(users)}">
                            <td colspan="9" class="text-center text-muted py-4">No users registered yet.</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        function updateClock() {
            document.getElementById('clock').textContent =
                new Date().toLocaleString('en-IN', {
                    day: '2-digit', month: 'short', year: 'numeric',
                    hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: true
                });
        }
        updateClock(); setInterval(updateClock, 1000);

        function filterTable() {
            const q = document.getElementById('searchInput').value.toLowerCase();
            document.querySelectorAll('#userTable tbody tr').forEach(row => {
                row.style.display =
                    row.textContent.toLowerCase().includes(q) ? '' : 'none';
            });
        }
    </script>

<link rel="stylesheet" th:href="@{/css/chatbot.css}">
<script th:src="@{/js/chatbot.js}"></script>
</body>

</html>
