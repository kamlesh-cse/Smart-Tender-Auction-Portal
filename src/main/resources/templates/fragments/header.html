<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:fragment="commonHead(title)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${title}">SmartPortal</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>

<body>

<!-- Live Clock -->
<div class="live-clock-bar">
    🕐 Live: <span id="liveClock"></span>
</div>

<!-- Navbar -->
<nav class="navbar">
    <a href="/" class="brand">🏛️ SmartPortal</a>
    <div class="nav-links">
        <a th:href="@{/}">Home</a>
        <a th:href="@{/auctions}">Auctions</a>
        <a th:href="@{/tenders}">Tenders</a>
        <a th:href="@{/about}">About</a>
        <a th:href="@{/contact}">Contact</a>
    </div>
    <div class="nav-right">
        <a th:href="@{/login}"  class="btn-login-nav">Login</a>
        <a th:href="@{/signup}" class="btn-signup-nav">Sign Up</a>
    </div>
</nav>
