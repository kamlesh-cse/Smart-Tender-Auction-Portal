<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Bids | User</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --sidebar-w: 240px;
            --primary: #0ea5e9;
            --accent: #38bdf8;
            --green: #1cc88a;
            --yellow: #f6c23e;
            --red: #e74a3b;
            --dark: #1a1c23;
            --light: #f8f9fc;
        }

        * {
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: var(--light);
            margin: 0;
        }

        #sidebar {
            width: var(--sidebar-w);
            height: 100vh;
            position: fixed;
            top: 0;
            left: 0;
            background: var(--dark);
            z-index: 100;
            display: flex;
            flex-direction: column;
            overflow-y: auto;
        }

        .sidebar-brand {
            padding: 22px 20px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.06);
            text-align: center;
        }

        .sidebar-brand .logo {
            font-size: 1.5rem;
        }

        .sidebar-brand h5 {
            color: #fff;
            font-weight: 800;
            margin: 6px 0 2px;
            font-size: 1rem;
        }

        .sidebar-brand small {
            color: rgba(255, 255, 255, 0.4);
            font-size: 0.75rem;
        }

        .nav-section {
            font-size: 0.7rem;
            text-transform: uppercase;
            letter-spacing: 0.1rem;
            color: rgba(255, 255, 255, 0.3);
            padding: 18px 20px 6px;
            font-weight: 600;
        }

        .sidebar-link {
            display: flex;
            align-items: center;
            gap: 10px;
            color: rgba(255, 255, 255, 0.65);
            text-decoration: none;
            padding: 11px 20px;
            font-size: 0.87rem;
            font-weight: 500;
            border-left: 3px solid transparent;
            transition: all 0.2s;
        }

        .sidebar-link:hover,
        .sidebar-link.active {
            color: #fff;
            background: rgba(255, 255, 255, 0.06);
            border-left-color: var(--accent);
        }

        .sidebar-link .icon {
            font-size: 1rem;
            width: 20px;
            text-align: center;
        }

        .sidebar-footer {
            margin-top: auto;
            padding: 16px;
            border-top: 1px solid rgba(255, 255, 255, 0.06);
        }

        .logout-btn {
            display: block;
            text-align: center;
            background: rgba(231, 74, 59, 0.15);
            color: #e74a3b;
            border: 1px solid rgba(231, 74, 59, 0.3);
            padding: 9px;
            border-radius: 8px;
            text-decoration: none;
            font-size: 0.85rem;
            font-weight: 600;
        }

        .logout-btn:hover {
            background: rgba(231, 74, 59, 0.25);
            color: #e74a3b;
        }

        #main {
            margin-left: var(--sidebar-w);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .topbar {
            background: #fff;
            padding: 0 30px;
            height: 65px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            box-shadow: 0 1px 0 #eee;
            position: sticky;
            top: 0;
            z-index: 50;
        }

        .topbar h5 {
            font-weight: 700;
            color: var(--dark);
            margin: 0;
        }

        .clock-badge {
            background: var(--light);
            border: 1px solid #e8e8e8;
            border-radius: 8px;
            padding: 6px 12px;
            font-size: 0.8rem;
            color: #555;
            font-weight: 600;
        }

        .user-badge {
            background: linear-gradient(135deg, var(--primary), #0284c7);
            color: #fff;
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: 700;
        }

        .page-body {
            padding: 28px 30px;
            flex: 1;
        }

        .data-card {
            background: #fff;
            border-radius: 12px;
            box-shadow: 0 2px 12px rgba(0, 0, 0, 0.06);
            overflow: hidden;
        }

        .data-card .table {
            margin: 0;
            font-size: 0.85rem;
        }

        .data-card thead th {
            background: var(--light);
            color: #888;
            font-size: 0.75rem;
            text-transform: uppercase;
            font-weight: 700;
            border: none;
            padding: 12px 16px;
        }

        .data-card tbody td {
            padding: 14px 16px;
            vertical-align: middle;
            border-top: 1px solid #f5f5f5;
            color: #444;
        }

        .data-card tbody tr:hover {
            background: #f5fbff;
        }

        .badge-live {
            background: #d1f0e3;
            color: #0a5c38;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.78rem;
            font-weight: 700;
        }

        .badge-won {
            background: #e0f2fe;
            color: #0284c7;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.78rem;
            font-weight: 700;
        }

        .badge-lost {
            background: #fde8e8;
            color: #7b1a1a;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.78rem;
            font-weight: 700;
        }

        .btn-tbl-view {
            background: #e0f2fe;
            color: #0284c7;
            border: none;
            padding: 5px 12px;
            border-radius: 6px;
            font-size: 0.78rem;
            font-weight: 600;
            text-decoration: none;
        }

        .auction-thumb {
            width: 44px;
            height: 44px;
            object-fit: cover;
            border-radius: 8px;
            border: 1px solid #eee;
        }

        .thumb-placeholder {
            width: 44px;
            height: 44px;
            background: #f0f0f0;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.2rem;
        }

        .search-bar {
            background: #fff;
            border: 1.5px solid #e8e8e8;
            border-radius: 8px;
            padding: 8px 14px;
            font-size: 0.88rem;
            width: 240px;
        }

        .search-bar:focus {
            outline: none;
            border-color: var(--primary);
        }
    </style>
</head>

<body>
    <th:block th:replace="~{fragments/sidebar :: sidebarStyles}"></th:block>
    <th:block th:replace="~{fragments/sidebar :: sidebar('USER','my-bids')}"></th:block>

    <div id="main">
        <div class="topbar">
            <h5>💰 My Bids</h5>
            <div style="display:flex;align-items:center;gap:14px">
                <div class="clock-badge">🕐 <span id="clock"></span></div>
                <div class="user-badge">👤 <span th:text="${userName}">User</span></div>
            </div>
        </div>

        <div class="page-body">
            <div
                style="display:flex;justify-content:space-between;align-items:center;margin-bottom:24px;flex-wrap:wrap;gap:12px">
                <div>
                    <h6 style="font-weight:800;color:var(--dark);margin:0">All My Bids</h6>
                    <small class="text-muted" th:text="${#lists.size(bids)} + ' bids placed'"></small>
                </div>
                <input type="text" id="searchInput" class="search-bar" placeholder="🔍 Search by auction name..."
                    onkeyup="filterTable()">
            </div>

            <div class="data-card">
                <table class="table" id="bidTable">
                    <thead>
                        <tr>
                            <th>#</th>
                            <th>Photo</th>
                            <th>Auction</th>
                            <th>My Bid</th>
                            <th>Highest Bid</th>
                            <th>Placed At</th>
                            <th>Result</th>
                            <th></th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="b, i : ${bids}">
                            <td class="text-muted" th:text="${i.index + 1}">1</td>
                            <td>
                                <img th:if="${b.auction.photo != null and !#strings.isEmpty(b.auction.photo)}"
                                    th:src="@{'/uploads/' + ${b.auction.photo}}" class="auction-thumb">
                                <div th:unless="${b.auction.photo != null and !#strings.isEmpty(b.auction.photo)}"
                                    class="thumb-placeholder">🔨</div>
                            </td>
                            <td style="font-weight:600;max-width:180px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap"
                                th:text="${b.auction.title}">—</td>
                            <td style="font-weight:800;color:var(--primary)"
                                th:text="${'₹' + #numbers.formatDecimal(b.bidAmount, 1, 'COMMA', 0, 'POINT')}">—</td>
                            <td style="font-weight:700;color:var(--green)"
                                th:text="${b.auction.currentHighestBid > 0 ? '₹' + #numbers.formatDecimal(b.auction.currentHighestBid, 1, 'COMMA', 0, 'POINT') : '—'}">
                                —</td>
                            <td style="font-size:0.78rem;color:#aaa"
                                th:text="${#temporals.format(b.bidTime,'dd MMM yyyy HH:mm')}">—</td>
                            <td>
                                <span th:if="${b.auction.winner != null and b.auction.winner.id == userObj.id}"
                                    class="badge-won">🏆 Won</span>
                                <span th:if="${b.auction.lifecycleStatus == 'LIVE'}" class="badge-live">⚡ Live</span>
                                <span
                                    th:if="${b.auction.status == 'CLOSED' and (b.auction.winner == null or b.auction.winner.id != userObj.id)}"
                                    class="badge-lost">❌ Lost</span>
                            </td>
                            <td>
                                <a th:href="@{'/user/auction/view/' + ${b.auction.id}}" class="btn-tbl-view">View</a>
                            </td>
                        </tr>
                        <tr th:if="${#lists.isEmpty(bids)}">
                            <td colspan="8" class="text-center text-muted py-5">
                                <div style="font-size:2rem;margin-bottom:10px">💰</div>
                                You haven't placed any bids yet.<br>
                                <a th:href="@{/user/auctions}" style="color:var(--primary);font-weight:700">Browse live
                                    auctions →</a>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        function updateClock() {
            document.getElementById('clock').textContent =
                new Date().toLocaleString('en-IN', {
                    day: '2-digit', month: 'short', year: 'numeric',
                    hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: true
                });
        }
        updateClock(); setInterval(updateClock, 1000);

        function filterTable() {
            const q = document.getElementById('searchInput').value.toLowerCase();
            document.querySelectorAll('#bidTable tbody tr').forEach(row => {
                row.style.display = row.textContent.toLowerCase().includes(q) ? '' : 'none';
            });
        }
    </script>

<link rel="stylesheet" th:href="@{/css/chatbot.css}">
<script th:src="@{/js/chatbot.js}"></script>
</body>

</html>
