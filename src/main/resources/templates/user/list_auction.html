<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Browse Auctions | User</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root { --sidebar-w:240px; --primary:#0ea5e9; --accent:#38bdf8; --green:#1cc88a; --yellow:#f6c23e; --red:#e74a3b; --dark:#1a1c23; --light:#f8f9fc; }
        * { box-sizing:border-box; }
        body { font-family:'Inter',sans-serif; background:var(--light); margin:0; }
        #sidebar { width:var(--sidebar-w); height:100vh; position:fixed; top:0; left:0; background:var(--dark); z-index:100; display:flex; flex-direction:column; overflow-y:auto; }
        .sidebar-brand { padding:22px 20px; border-bottom:1px solid rgba(255,255,255,0.06); text-align:center; }
        .sidebar-brand .logo { font-size:1.5rem; }
        .sidebar-brand h5 { color:#fff; font-weight:800; margin:6px 0 2px; font-size:1rem; }
        .sidebar-brand small { color:rgba(255,255,255,0.4); font-size:0.75rem; }
        .nav-section { font-size:0.7rem; text-transform:uppercase; letter-spacing:0.1rem; color:rgba(255,255,255,0.3); padding:18px 20px 6px; font-weight:600; }
        .sidebar-link { display:flex; align-items:center; gap:10px; color:rgba(255,255,255,0.65); text-decoration:none; padding:11px 20px; font-size:0.87rem; font-weight:500; border-left:3px solid transparent; transition:all 0.2s; }
        .sidebar-link:hover, .sidebar-link.active { color:#fff; background:rgba(255,255,255,0.06); border-left-color:var(--accent); }
        .sidebar-link .icon { font-size:1rem; width:20px; text-align:center; }
        .sidebar-footer { margin-top:auto; padding:16px; border-top:1px solid rgba(255,255,255,0.06); }
        .logout-btn { display:block; text-align:center; background:rgba(231,74,59,0.15); color:#e74a3b; border:1px solid rgba(231,74,59,0.3); padding:9px; border-radius:8px; text-decoration:none; font-size:0.85rem; font-weight:600; }
        .logout-btn:hover { background:rgba(231,74,59,0.25); color:#e74a3b; }
        #main { margin-left:var(--sidebar-w); min-height:100vh; display:flex; flex-direction:column; }
        .topbar { background:#fff; padding:0 30px; height:65px; display:flex; align-items:center; justify-content:space-between; box-shadow:0 1px 0 #eee; position:sticky; top:0; z-index:50; }
        .topbar h5 { font-weight:700; color:var(--dark); margin:0; }
        .clock-badge { background:var(--light); border:1px solid #e8e8e8; border-radius:8px; padding:6px 12px; font-size:0.8rem; color:#555; font-weight:600; }
        .user-badge { background:linear-gradient(135deg,var(--primary),#0284c7); color:#fff; padding:6px 14px; border-radius:20px; font-size:0.8rem; font-weight:700; }
        .page-body { padding:28px 30px; flex:1; }
        .alert { border-radius:10px; font-size:0.87rem; border:none; }
        .alert-success { background:#d1f0e3; color:#0a5c38; }
        .alert-danger { background:#fde8e8; color:#7b1a1a; }
        .search-bar { background:#fff; border:1.5px solid #e8e8e8; border-radius:8px; padding:8px 14px; font-size:0.88rem; width:260px; }
        .search-bar:focus { outline:none; border-color:var(--primary); }
        .filter-btn { border:1.5px solid #e8e8e8; background:#fff; border-radius:8px; padding:8px 16px; font-size:0.83rem; font-weight:600; color:#666; cursor:pointer; transition:all 0.2s; }
        .filter-btn.active, .filter-btn:hover { border-color:var(--primary); color:var(--primary); background:#e0f2fe; }
        .auction-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(260px,1fr)); gap:20px; }
        .auction-card { background:#fff; border-radius:14px; box-shadow:0 2px 12px rgba(0,0,0,0.07); overflow:hidden; transition:transform 0.2s,box-shadow 0.2s; }
        .auction-card:hover { transform:translateY(-4px); box-shadow:0 8px 24px rgba(0,0,0,0.12); }
        .card-img-wrap { height:160px; overflow:hidden; background:#f0f4f8; display:flex; align-items:center; justify-content:center; font-size:3rem; position:relative; }
        .card-img-wrap img { width:100%; height:100%; object-fit:cover; }
        .status-pill { position:absolute; top:10px; right:10px; padding:3px 10px; border-radius:20px; font-size:0.72rem; font-weight:800; }
        .pill-open   { background:#d1f0e3; color:#0a5c38; }
        .pill-closed { background:#fde8e8; color:#7b1a1a; }
        .card-body { padding:16px; }
        .card-body h6 { font-weight:700; color:var(--dark); font-size:0.92rem; margin-bottom:8px; overflow:hidden; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; }
        .price-row { display:flex; justify-content:space-between; align-items:center; margin-bottom:8px; }
        .price-label { font-size:0.72rem; color:#aaa; font-weight:600; }
        .price-value { font-size:1.05rem; font-weight:800; color:var(--primary); }
        .countdown-pill { background:#e0f2fe; border-radius:6px; padding:5px 10px; font-size:0.75rem; font-weight:700; color:var(--primary); margin-bottom:12px; }
        .countdown-pill.urgent { background:#fde8e8; color:var(--red); }
        .btn-view { display:block; text-align:center; background:linear-gradient(135deg,var(--primary),#0284c7); color:#fff; padding:10px; border-radius:8px; font-weight:700; font-size:0.88rem; text-decoration:none; transition:opacity 0.2s; }
        .btn-view:hover { opacity:0.88; color:#fff; }
        .btn-view-closed { display:block; text-align:center; background:var(--light); color:#888; border:1.5px solid #e0e4ef; padding:10px; border-radius:8px; font-weight:600; font-size:0.88rem; text-decoration:none; }
    </style>
</head>
<body>
    <th:block th:replace="~{fragments/sidebar :: sidebarStyles}"></th:block>
    <th:block th:replace="~{fragments/sidebar :: sidebar('USER','auctions')}"></th:block>

<div id="main">
    <div class="topbar">
        <h5>🔨 Browse Auctions</h5>
        <div style="display:flex;align-items:center;gap:14px">
            <div class="clock-badge">🕐 <span id="clock"></span></div>
            <div class="user-badge">👤 <span th:text="${userName}">User</span></div>
        </div>
    </div>

    <div class="page-body">
        <div th:if="${success}" class="alert alert-success mb-3" th:text="${success}"></div>
        <div th:if="${error}"   class="alert alert-danger  mb-3" th:text="${error}"></div>

        <!-- Toolbar -->
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:24px;flex-wrap:wrap;gap:12px">
            <div>
                <h6 style="font-weight:800;color:var(--dark);margin:0">All Auctions</h6>
                <small class="text-muted" th:text="${#lists.size(auctions)} + ' auctions available'"></small>
            </div>
            <div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap">
                <button class="filter-btn active" onclick="filterCards('all', this)">All</button>
                <button class="filter-btn" onclick="filterCards('open', this)">🟢 Live</button>
                <button class="filter-btn" onclick="filterCards('closed', this)">🔴 Closed</button>
                <input type="text" id="searchInput" class="search-bar"
                       placeholder="🔍 Search auctions..." oninput="filterCards('current', this)">
            </div>
        </div>

        <!-- Auction Grid -->
        <div class="auction-grid" id="auctionGrid">
            <div th:each="a : ${auctions}" class="auction-card"
                 th:attr="data-status=${a.lifecycleStatus.toLowerCase()},data-title=${a.title.toLowerCase()}">
                <div class="card-img-wrap">
                    <img th:if="${a.photo != null and !#strings.isEmpty(a.photo)}"
                         th:src="@{'/uploads/' + ${a.photo}}" alt="auction">
                    <span th:unless="${a.photo != null and !#strings.isEmpty(a.photo)}">🔨</span>
                    <span th:if="${a.lifecycleStatus == 'LIVE'}"   class="status-pill pill-open">LIVE</span>
                    <span th:if="${a.lifecycleStatus == 'UPCOMING'}" class="status-pill" style="background:#fff3d4;color:#7d6608">UPCOMING</span>
                    <span th:if="${a.lifecycleStatus == 'CLOSED' or a.lifecycleStatus == 'CANCELLED'}" class="status-pill pill-closed">CLOSED</span>
                </div>
                <div class="card-body">
                    <h6 th:text="${a.title}">Title</h6>
                    <div class="price-row">
                        <div>
                            <div class="price-label" th:text="${a.currentHighestBid > 0 ? 'Highest Bid' : 'Starting Price'}"></div>
                            <div class="price-value"
                                 th:text="${a.currentHighestBid > 0 ? '₹' + a.currentHighestBid : '₹' + a.startingPrice}">—</div>
                        </div>
                    </div>
                    <div th:if="${a.lifecycleStatus == 'LIVE'}"
                         class="countdown-pill"
                         th:attr="data-deadline=${a.deadline}"
                         th:id="'cd-' + ${a.id}">⏱ Loading...</div>
                    <div th:unless="${a.lifecycleStatus == 'LIVE'}"
                         style="font-size:0.78rem;color:#aaa;margin-bottom:12px">
                        Auction closed
                        <span th:if="${a.winner != null}"
                              style="font-weight:700;color:var(--green)"
                              th:text="' · 🏆 ' + ${a.winner.name}"></span>
                    </div>
                    <a th:if="${a.lifecycleStatus == 'LIVE'}"
                       th:href="@{'/user/auction/view/' + ${a.id}}"
                       class="btn-view">Place Bid →</a>
                    <a th:unless="${a.lifecycleStatus == 'LIVE'}"
                       th:href="@{'/user/auction/view/' + ${a.id}}"
                       class="btn-view-closed">View Results</a>
                </div>
            </div>
        </div>

        <div th:if="${#lists.isEmpty(auctions)}"
             style="text-align:center;padding:60px;color:#aaa">
            <div style="font-size:3rem;margin-bottom:12px">🔨</div>
            No auctions available right now.
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>
    function updateClock() {
        document.getElementById('clock').textContent =
            new Date().toLocaleString('en-IN', {
                day:'2-digit',month:'short',year:'numeric',
                hour:'2-digit',minute:'2-digit',second:'2-digit',hour12:true
            });
    }
    updateClock(); setInterval(updateClock, 1000);

    let currentFilter = 'all';
    let currentSearch = '';

    function filterCards(type, el) {
        if (type === 'all' || type === 'open' || type === 'closed') {
            currentFilter = type;
            document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
            if (el) el.classList.add('active');
        }
        if (type === 'current') {
            currentSearch = el.value.toLowerCase();
        }
        document.querySelectorAll('.auction-card').forEach(card => {
            const matchFilter = currentFilter === 'all' || card.dataset.status === currentFilter;
            const matchSearch = card.dataset.title.includes(currentSearch);
            card.style.display = (matchFilter && matchSearch) ? '' : 'none';
        });
    }

    function updateCountdowns() {
        document.querySelectorAll('[data-deadline]').forEach(el => {
            const deadline = new Date(el.dataset.deadline);
            const diff = deadline - new Date();
            if (diff <= 0) {
                el.textContent = '⌛ Ended';
                el.classList.add('urgent');
                return;
            }
            const h = Math.floor(diff/3600000);
            const m = Math.floor((diff%3600000)/60000);
            const s = Math.floor((diff%60000)/1000);
            el.textContent = '⏱ ' + h + 'h ' + m + 'm ' + s + 's left';
            if (h < 1) el.classList.add('urgent');
        });
    }
    updateCountdowns(); setInterval(updateCountdowns, 1000);
</script>

<link rel="stylesheet" th:href="@{/css/chatbot.css}">
<script th:src="@{/js/chatbot.js}"></script>
</body>
</html>
