<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | Smart Portal</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #4e73df;
            --dark: #1a1c23;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #1a1c23 0%, #2d3561 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .auth-wrapper {
            width: 100%;
            max-width: 440px;
        }

        .brand-header {
            text-align: center;
            margin-bottom: 28px;
        }

        .brand-header .logo {
            font-size: 2.5rem;
        }

        .brand-header h2 {
            color: #fff;
            font-size: 1.4rem;
            font-weight: 700;
            margin: 8px 0 4px;
        }

        .brand-header p {
            color: rgba(255, 255, 255, 0.55);
            font-size: 0.87rem;
        }

        .auth-card {
            background: #fff;
            border-radius: 16px;
            padding: 36px 32px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
        }

        .auth-card h4 {
            font-weight: 700;
            color: var(--dark);
            margin-bottom: 4px;
        }

        .auth-card .sub {
            color: #888;
            font-size: 0.85rem;
            margin-bottom: 24px;
        }

        .form-label {
            font-size: 0.85rem;
            font-weight: 600;
            color: #4e5e7a;
            margin-bottom: 5px;
        }

        .form-control,
        .form-select {
            border: 1.5px solid #e0e4ef;
            border-radius: 8px;
            padding: 10px 14px;
            font-size: 0.9rem;
            transition: border-color 0.2s;
        }

        .form-control:focus,
        .form-select:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(78, 115, 223, 0.12);
        }

        .btn-login {
            width: 100%;
            background: linear-gradient(135deg, var(--primary), #224abe);
            border: none;
            border-radius: 8px;
            padding: 12px;
            font-weight: 600;
            font-size: 0.95rem;
            color: #fff;
            margin-top: 6px;
            cursor: pointer;
            transition: opacity 0.2s;
        }

        .btn-login:hover {
            opacity: 0.9;
        }

        .divider {
            text-align: center;
            color: #bbb;
            font-size: 0.82rem;
            margin: 18px 0;
            position: relative;
        }

        .divider::before,
        .divider::after {
            content: '';
            position: absolute;
            top: 50%;
            width: 42%;
            height: 1px;
            background: #eee;
        }

        .divider::before {
            left: 0;
        }

        .divider::after {
            right: 0;
        }

        .link-row {
            text-align: center;
            font-size: 0.87rem;
            color: #666;
        }

        .link-row a {
            color: var(--primary);
            font-weight: 600;
            text-decoration: none;
        }

        .link-row a:hover {
            text-decoration: underline;
        }

        .alert {
            border-radius: 8px;
            font-size: 0.87rem;
            padding: 10px 14px;
        }

        /* Role cards */
        .role-card-grid,
        .role-tabs {
            display: grid;
            grid-template-columns: repeat(4, minmax(0, 1fr));
            gap: 10px;
            margin-bottom: 22px;
        }

        .role-card,
        .role-tab {
            min-height: 90px;
            border: 1px solid rgba(102, 126, 234, 0.16);
            border-radius: 16px;
            background: linear-gradient(180deg, rgba(255, 255, 255, 0.98), rgba(248, 250, 255, 0.94));
            color: #21304f;
            box-shadow: 0 10px 24px rgba(37, 54, 112, 0.08);
            cursor: pointer;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 8px;
            padding: 13px 6px;
            transition: transform 0.22s ease, box-shadow 0.22s ease, border-color 0.22s ease, background 0.22s ease;
        }

        .role-card:hover,
        .role-tab:hover {
            transform: translateY(-3px);
            border-color: rgba(102, 126, 234, 0.42);
            box-shadow: 0 16px 34px rgba(37, 54, 112, 0.14);
        }

        .role-card:focus-visible,
        .role-tab:focus-visible {
            outline: 3px solid rgba(102, 126, 234, 0.34);
            outline-offset: 3px;
        }

        .role-card.active,
        .role-card[aria-pressed="true"],
        .role-tab.active,
        .role-tab[aria-pressed="true"] {
            border-color: rgba(102, 126, 234, 0.72);
            background: linear-gradient(180deg, #ffffff, #eef2ff);
            box-shadow: 0 18px 42px rgba(102, 126, 234, 0.22);
        }

        .role-emoji {
            width: 38px;
            height: 38px;
            border-radius: 14px;
            background: rgba(102, 126, 234, 0.1);
            display: grid;
            place-items: center;
            font-size: 22px;
            line-height: 1;
        }

        .role-label {
            font-size: 0.78rem;
            font-weight: 800;
            line-height: 1.1;
        }

        /* Password toggle */
        .pw-wrapper {
            position: relative;
        }

        .pw-toggle {
            position: absolute;
            right: 12px;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            cursor: pointer;
            font-size: 1.1rem;
            color: #aaa;
            padding: 0;
            line-height: 1;
        }

        .pw-toggle:hover {
            color: var(--primary);
        }

        .pw-wrapper .form-control {
            padding-right: 42px;
        }

        /* Forgot password link */
        .forgot-link {
            font-size: 0.82rem;
            color: var(--primary);
            font-weight: 600;
            text-decoration: none;
            float: right;
        }

        .forgot-link:hover {
            text-decoration: underline;
        }

        .pw-label-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 5px;
        }

        .pw-label-row .form-label {
            margin-bottom: 0;
        }

        @media (max-width: 520px) {
            .role-card-grid,
            .role-tabs {
                grid-template-columns: repeat(2, minmax(0, 1fr));
            }
        }
    </style>
</head>

<body>
    <div class="auth-wrapper">
        <div class="brand-header">
            <div class="logo">🏛️</div>
            <h2>Smart Portal</h2>
            <p>Tender &amp; Auction Management System</p>
        </div>

        <div class="auth-card">
            <h4>Welcome back</h4>
            <p class="sub">Sign in to your account</p>

            <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>
            <div th:if="${success}" class="alert alert-success" th:text="${success}"></div>

            <!-- Role indicator pills -->
            <div class="role-tabs">
                <div class="role-tab adm">👑 Admin</div>
                <div class="role-tab gov">🏛 Govt</div>
                <div class="role-tab comp">🏢 Company</div>
                <div class="role-tab usr">👤 User</div>
            </div>

            <form th:action="@{/login}" method="post"><input type="hidden" name="_csrf" th:value="${_csrf}" />
                <div class="mb-3">
                    <label class="form-label">Email / Username</label>
                    <input type="text" name="email" id="loginEmail" class="form-control" placeholder="Enter Your E-Mail"
                        required autofocus>
                </div>

                <div class="mb-3">
                    <!-- Label row with Forgot Password link -->
                    <div class="pw-label-row">
                        <label class="form-label">Password</label>
                        <a th:href="@{/forgot-password}" class="forgot-link">Forgot password?</a>
                    </div>
                    <!-- Password field with show/hide toggle -->
                    <div class="pw-wrapper">
                        <input type="password" name="password" id="loginPassword" class="form-control"
                            placeholder="Enter your password" required>
                        <button type="button" class="pw-toggle" id="loginPwToggle" onclick="toggleLoginPassword()"
                            title="Show / Hide password">👁️</button>
                    </div>
                </div>

                <button type="submit" class="btn-login">Sign In →</button>
            </form>

            <div class="divider">or</div>
            <div class="link-row">
                Don't have an account? <a th:href="@{/signup}">Create one</a>
            </div>
        </div>
    </div>

    <script>
        const roleMeta = {
            adm: { icon: '👑', label: 'Admin' },
            gov: { icon: '🏛', label: 'Government' },
            comp: { icon: '🏢', label: 'Company' },
            usr: { icon: '👤', label: 'User' }
        };

        document.querySelectorAll('.role-tab, .role-card').forEach((card) => {
            const roleClass = Array.from(card.classList).find((name) => roleMeta[name]);
            const meta = roleClass ? roleMeta[roleClass] : null;

            if (meta) {
                card.innerHTML = `<span class="role-emoji" aria-hidden="true">${meta.icon}</span><span class="role-label">${meta.label}</span>`;
                card.setAttribute('aria-label', meta.label);
            }

            card.setAttribute('role', 'button');
            card.setAttribute('tabindex', '0');
            card.setAttribute('aria-pressed', card.classList.contains('usr') ? 'true' : 'false');

            if (card.classList.contains('usr')) {
                card.classList.add('active');
            }

            const selectCard = () => {
                document.querySelectorAll('.role-tab, .role-card').forEach((item) => {
                    item.classList.remove('active');
                    item.setAttribute('aria-pressed', 'false');
                });
                card.classList.add('active');
                card.setAttribute('aria-pressed', 'true');
            };

            card.addEventListener('click', selectCard);
            card.addEventListener('keydown', (event) => {
                if (event.key === 'Enter' || event.key === ' ') {
                    event.preventDefault();
                    selectCard();
                }
            });
        });

        function toggleLoginPassword() {
            const input = document.getElementById('loginPassword');
            const btn = document.getElementById('loginPwToggle');
            if (input.type === 'password') {
                input.type = 'text';
                btn.textContent = '🙈';
            } else {
                input.type = 'password';
                btn.textContent = '👁️';
            }
        }
    </script>

    <link rel="stylesheet" th:href="@{/css/chatbot.css}">
    <script th:src="@{/js/chatbot.js}"></script>
</body>

</html>
