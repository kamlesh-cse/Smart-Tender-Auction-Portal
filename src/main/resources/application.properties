spring.application.name=Smart-Tender-Auction-Portal
server.port=8181

# Database: XAMPP MariaDB
spring.datasource.url=${DB_URL:jdbc:mariadb://localhost:3306/smart_portal}
spring.datasource.username=${DB_USERNAME:smartportal}
spring.datasource.password=${DB_PASSWORD:SmartPortal@2026}
spring.datasource.driver-class-name=org.mariadb.jdbc.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# Flyway
spring.flyway.enabled=true

# Caching
spring.cache.type=caffeine
spring.cache.caffeine.spec=maximumSize=1000,expireAfterWrite=60s

# Thymeleaf
spring.thymeleaf.cache=false

# File uploads
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
app.upload.dir=${APP_UPLOAD_DIR:${user.home}/smartportal-uploads/}

# Scheduling and async
spring.task.scheduling.pool.size=5
spring.task.execution.pool.core-size=5
spring.task.execution.pool.max-size=10

# Administrator credentials
app.admin.username=${ADMIN_USERNAME:admin}
app.admin.password=${ADMIN_PASSWORD:$2a$10$N9qo8uLOickgx2ZMRZoMyeIjZAgcfl7p92ldGxad68LJZdL17lhWy}

# Application secret
app.secret=${APP_SECRET:SmartTenderAuctionPortalSuperSecretKey2026}

# Security
app.security.login.max-attempts=5
app.security.login.lock-duration=PT15M
app.security.trust-forwarded-for=${TRUST_FORWARDED_FOR:false}

# Email
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${SMTP_USERNAME:}
spring.mail.password=${SMTP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# Reliability
app.retry.email.max-attempts=3
app.retry.email.delay-ms=1000
app.retry.websocket.max-attempts=3
app.retry.websocket.delay-ms=250
app.retry.close.max-attempts=3
app.retry.close.delay-ms=500
app.scheduler.auction.delay-ms=60000
app.scheduler.tender.delay-ms=300000

# Monitoring
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=when_authorized
management.health.mail.enabled=false
management.metrics.tags.application=${spring.application.name}

# Session
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.timeout=30m